name: FactoryIQ verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_USER: factoryiq
          POSTGRES_PASSWORD: test-db-only
          POSTGRES_DB: factoryiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoryiq -d factoryiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend and reversible migrations
        env:
          DATABASE_URL: postgresql+psycopg://factoryiq:test-db-only@127.0.0.1/factoryiq_test
          FACTORYIQ_TEST_MQTT_DOCKER: "true"
          FACTORYIQ_TEST_DATABASE_URL: postgresql+psycopg://factoryiq:test-db-only@127.0.0.1/factoryiq_test
          PYTHONPATH: backend
        run: |
          pip install -r backend/requirements.txt
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
          pytest backend/tests -q
      - name: Start containerized synthetic demo
        run: |
          sh scripts/init-local-env.sh
          docker compose --profile iot up --build --wait
          curl --fail http://127.0.0.1:8000/health
      - name: Test the built client in Chromium
        run: |
          set -a
          . ./.env
          set +a
          export FACTORYIQ_E2E_URL=http://127.0.0.1:8000
          cd frontend
          npm ci
          npx playwright install --with-deps --only-shell chromium
          npm test

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Compile ESP32 firmware with the empty credential template
        run: |
          python -m pip install platformio==6.2.0
          pio run -d hardware/esp32
