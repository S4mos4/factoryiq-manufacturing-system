services:
  broker:
    environment:
      FACTORYIQ_MQTT_LAN_TLS: "true"
      FACTORYIQ_ESP32_PASSWORD: ${FACTORYIQ_ESP32_PASSWORD:?Set a separate ESP32 password}
    volumes:
      - "${FACTORYIQ_MQTT_TLS_DIR:?Set TLS directory}:/run/factoryiq-tls:ro"
    ports:
      - "${FACTORYIQ_MQTT_LAN_IP:?Set the host LAN IP}:8883:8883"
